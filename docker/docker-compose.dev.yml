services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: katauser-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: katauser
    ports:
      - '5432:5432'
    volumes:
      - katauser_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: katauser-dev-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - katauser_redisdata:/data

volumes:
  katauser_pgdata:
  katauser_redisdata:

