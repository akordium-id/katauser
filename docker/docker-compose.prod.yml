services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: katauser-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-katauser}
    ports:
      - '5432:5432'
    volumes:
      - katauser_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: katauser-prod-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - katauser_prod_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: katauser-prod-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-katauser}
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: katauser-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ORIGIN: ${APP_ORIGIN:-https://katauser.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:3000}
    ports:
      - '3001:3000'
    depends_on:
      - api

volumes:
  katauser_prod_pgdata:
  katauser_prod_redisdata:

